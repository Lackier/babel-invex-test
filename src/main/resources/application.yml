server.port: 8080

spring.application.name: employee-service

spring.datasource.url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:employeedb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver
spring.datasource.username: ${DB_USERNAME:employee}
spring.datasource.password: ${DB_PASSWORD:employee}

spring.jpa.database-platform: org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto: validate
spring.jpa.show-sql: false
spring.jpa.open-in-view: false

spring.flyway.enabled: true
spring.flyway.locations: classpath:db/migration
spring.flyway.baseline-on-migrate: true

management.endpoints.web.exposure.include: health,info
management.endpoint.health.show-details: when-authorized

spring.security.user.name: ${SECURITY_USERNAME:admin}
spring.security.user.password: ${SECURITY_PASSWORD:admin}

springdoc.swagger-ui.path: /swagger-ui.html
springdoc.api-docs.path: /v3/api-docs

app.request.max-body-size-bytes: 1048576

logging.pattern.console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
logging.level.root: INFO
logging.level.com.babel.employeeservice: DEBUG
logging.level.org.hibernate.SQL: WARN
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
