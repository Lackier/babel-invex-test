# Overrides src/main/resources/application.yml on the test classpath (target/test-classes comes
# before target/classes), so tests always run against H2 regardless of the production datasource.
server.port: 8080

spring.application.name: employee-service

spring.datasource.url: jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name: org.h2.Driver
spring.datasource.username: sa
spring.datasource.password: ""

spring.jpa.database-platform: org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto: validate
spring.jpa.show-sql: false
spring.jpa.open-in-view: false

spring.flyway.enabled: true
spring.flyway.locations: classpath:db/migration
spring.flyway.baseline-on-migrate: true

management.endpoints.web.exposure.include: health,info

spring.security.user.name: test
spring.security.user.password: test

app.request.max-body-size-bytes: 1048576

logging.level.root: INFO
logging.level.com.babel.employeeservice: DEBUG
